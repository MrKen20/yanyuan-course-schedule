<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>燕园课程表 · 课程表查询</title>
  <meta name="description" content="一个基于原生 HTML/CSS/JavaScript 的课程表查询小工具，北大红 UI 风格。" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo">课</span>
        <div class="brand-text">
          <h1>燕园课程表</h1>
        </div>
      </div>
      <div class="search-box">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input id="searchInput" type="text" placeholder="搜索课程名 / 教师 / 教室…" autocomplete="off" />
      </div>
    </div>
  </header>

  <!-- 功能区 -->
  <main class="container">
    <section class="toolbar">
      <div class="toolbar-left">
        <button id="todayBtn" class="btn btn-primary">回到今天</button>
        <div class="week-nav">
          <button id="prevWeekBtn" class="week-btn" title="上一周">‹</button>
          <span id="weekLabel" class="week-label">第 1 周</span>
          <button id="nextWeekBtn" class="week-btn" title="下一周">›</button>
        </div>
        <div class="day-tabs" id="dayTabs"></div>
      </div>
      <div class="toolbar-right">
        <span class="today-info" id="todayInfo"></span>
      </div>
    </section>

    <!-- 课程表主体 -->
    <section class="schedule-card" aria-label="课程表">
      <div class="schedule-grid" id="scheduleGrid"></div>
    </section>

    <!-- 当日课程列表（移动端友好） -->
    <section class="day-list-card" aria-label="选中日期课程列表">
      <h2 id="dayListTitle">今日课程</h2>
      <ul class="day-list" id="dayList"></ul>
      <p class="empty-tip" id="emptyTip" hidden>这一天没有课程，好好休息 🌿</p>
    </section>

    <footer class="page-footer">
      <p>本课程表数据为演示数据 · 《互联网软件开发技术与实践》课程作业 · <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </main>

  <!-- 课程详情弹窗 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
      <h3 id="modalTitle"></h3>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
