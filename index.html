<!DOCTYPE html>

<body data-page-node-id="sUKCt71rC7ig9ypRDVZSaF">

    <div class="topbar-inner" data-page-node-id="B3NiltsDuY7N2RCiPMaqmw">

        <span class="brand-logo" data-page-node-id="1a7EuxCGo32VDya1kFzj7P">课</span>

          <h1 data-page-node-id="1PQqwkPwo7lvsKQzhsTGSw">燕园课程表</h1>
        </div>
      </div>
      <div class="search-box" data-page-node-id="Im4CYvI3JNHtGQwAXb7nDe">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" data-page-node-id="4oCOFfvWE23Vs4oWuxD7pg">

    </div>

        </div>
        <div class="day-tabs" id="dayTabs" data-page-node-id="7NeaMkqmJM1Vnxl693sz3h"></div>
      </div>
      <div class="toolbar-right" data-page-node-id="vSNAh0h52GIUonJl9k5hZb">

    <section class="day-list-card" aria-label="选中日期课程列表" data-page-node-id="Ck1sh1xfZbd9GKUeKB2HDG">
      <h2 id="dayListTitle" data-page-node-id="zknYzY1gosttRWLFK2VSSz">今日课程</h2>

    <footer class="page-footer" data-page-node-id="6ARJpBxGAY0AtVRl6cNc4u">

    </footer>

      <div class="modal-body" id="modalBody" data-page-node-id="drSCDE1FCVAqYjoQ9m1igw"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</html>
